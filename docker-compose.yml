services:
  openvpn:
    # Immutable published release; do not replace this version's content.
    image: 3rnn/openvpn:v1.1.2-hardened@sha256:0e637729aab170d31c3acd7a9f05cbf3335a94c52cf9ae00c9912dd71a92620c
    platform: linux/amd64
    # Runtime uses root and Docker default capabilities PLUS NET_ADMIN.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true
    ports:
      - "1194:1194/udp"
      - "127.0.0.1:8833:8833"
    volumes:
      - ./data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Forwarding is container-network-namespace scoped, never host sysctl.
    sysctls:
      net.ipv4.ip_forward: "1"
